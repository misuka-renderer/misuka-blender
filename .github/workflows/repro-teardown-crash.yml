# Reproduce the Windows teardown crash behind issues #44 and #4.
#
# Manual only: this answers a question, it does not gate anything, so it has no
# business running on every push.
#
# The cells vary two things and nothing else: which renderer wheel is installed,
# and which Python hosts it. misuka pins struct-jit at ea69db6e, and so does
# mitsuba 3.9.0, so `mitsuba` is a clean upstream control. mitsuba 3.8.0 predates
# struct-jit entirely. Blender and Miniconda matter because both ship their own
# msvcp140.dll next to the executable, which can shadow the system one - and both
# are what the reporter used.
name: Repro teardown crash (#44, #4)

on:
  workflow_dispatch:
  # Temporary, and removed before this branch merges. `workflow_dispatch` can
  # only be triggered for a workflow that already exists on the default branch,
  # so until this file lands on master a push trigger is the only way to run it.
  push:
    branches:
      - windows-teardown-crash

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "A - misuka, system python (windows)"
            os: windows-latest
            package: "misuka==0.1.0"
            module: misuka
            host: system
          - label: "B - misuka, blender 4.5 python (windows)"
            os: windows-latest
            package: "misuka==0.1.0"
            module: misuka
            host: blender
            blender: "4.5"
          - label: "H - misuka, blender 4.2 python (windows)"
            os: windows-latest
            package: "misuka==0.1.0"
            module: misuka
            host: blender
            blender: "4.2"
          - label: "I - misuka, inside blender.exe 4.2 (windows)"
            os: windows-latest
            package: "misuka==0.1.0"
            module: misuka
            host: blender
            blender: "4.2"
            inside_blender: true
          - label: "C - mitsuba 3.9.0, system python (windows)"
            os: windows-latest
            package: "mitsuba==3.9.0"
            module: mitsuba
            host: system
          - label: "D - mitsuba 3.8.0, system python (windows)"
            os: windows-latest
            package: "mitsuba==3.8.0"
            module: mitsuba
            host: system
          - label: "E - misuka, miniconda python (windows)"
            os: windows-latest
            package: "misuka==0.1.0"
            module: misuka
            host: conda
          - label: "G - drjit alone, system python (windows)"
            os: windows-latest
            package: "drjit==1.5.0"
            module: drjit
            host: system
          - label: "F - misuka, system python (linux control)"
            os: ubuntu-latest
            package: "misuka==0.1.0"
            module: misuka
            host: system

    steps:
    - name: Git checkout
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        # The reporter used 3.11, both under Anaconda and inside Blender 4.5.
        python-version: "3.11"

    - name: Setup uv
      uses: astral-sh/setup-uv@v5

    - name: Install requests
      if: matrix.host == 'blender'
      run: uv pip install --system --upgrade requests

    - name: Download Blender
      if: matrix.host == 'blender'
      run: python scripts/blender_downloader.py ${{ matrix.blender }} -o blender

    - name: Resolve the host interpreter
      id: host
      shell: bash
      run: |
        case "${{ matrix.host }}" in
          blender)
            PYTHON=$(find blender/ -regextype posix-extended \
              -regex '.*bin\/python(.exe|[0-9].[0-9]{1,2}m?)' -print -quit)
            ;;
          conda)
            # $CONDA is the runner's Miniconda root, with Windows backslashes.
            # uv is a native Windows binary, so it needs a drive-letter path,
            # not an MSYS /c/... one.
            PYTHON="${CONDA//\\//}/python.exe"
            ;;
          *)
            # `which python` on Windows returns an MSYS path with no .exe,
            # which uv rejects. Ask the interpreter for its own location.
            PYTHON=$(python -c "import sys; print(sys.executable.replace(chr(92), '/'))")
            ;;
        esac
        echo "Host interpreter is $PYTHON"
        "$PYTHON" --version
        echo "PYTHON=$PYTHON" >> "$GITHUB_OUTPUT"

    - name: Install ${{ matrix.package }}
      shell: bash
      run: |
        uv pip install --python "${{ steps.host.outputs.PYTHON }}" \
          --reinstall "${{ matrix.package }}" numpy
        uv pip show --python "${{ steps.host.outputs.PYTHON }}" \
          "${{ matrix.module }}" || true

    - name: Probe
      if: ${{ ! matrix.inside_blender }}
      shell: bash
      env:
        PROBE_LABEL: ${{ matrix.label }}
      run: |
        "${{ steps.host.outputs.PYTHON }}" scripts/win_crash_probe.py \
          --module "${{ matrix.module }}"

    # Running through blender.exe rather than its bundled python.exe is the
    # variable that matters: only inside Blender does load_file fault. Each
    # probe is its own process, so a crash in one does not hide the rest.
    - name: Probe inside Blender
      if: ${{ matrix.inside_blender }}
      shell: bash
      env:
        PROBE_LABEL: ${{ matrix.label }}
      run: |
        BLENDER=$(find blender/ -maxdepth 1 -regextype posix-extended \
          -regex '.*blender(.exe)?' -print -quit)
        echo "Blender is $BLENDER"
        FAILED=0
        for probe in import ply plybinst scene acoustic bitmap drjit numpy crt; do
          echo "=============================================================="
          echo "== $probe"
          echo "=============================================================="
          set +e
          "./$BLENDER" -b -noaudio --factory-startup \
            --python scripts/win_crash_probe.py -- \
            --module "${{ matrix.module }}" --probe "$probe"
          STATUS=$?
          set -e
          echo "-- $probe exited $STATUS"
          [ "$STATUS" -eq 0 ] || FAILED=1
        done
        exit $FAILED
