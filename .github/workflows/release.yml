# Packages the add-on and opens a draft GitHub release for a version tag.
#
# Automatic releases are OFF for now.
# To go back to releasing on tag push, uncomment the `push:`
# trigger below; everything else here is already set up for it.
name: Release

on:
  # push:
  #   tags:
  #     - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to package, e.g. v0.1.1"
        required: true
        type: string

# Workflow steps
jobs:
  # Gate the release on the full matrix. The per-cell badge workflows exist for
  # README status; here a single pass/fail across every combination is what matters.
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        blender-version: ["3.6", "4.2", "4.5", "5.2"]
    uses: ./.github/workflows/test-suite.yml
    with:
      os: ${{ matrix.os }}
      blender-version: ${{ matrix.blender-version }}


  package:
    name: "Package Release"
    needs: [tests]
    runs-on: "ubuntu-latest"

    permissions:
      contents: write

    steps:
    - name: Git checkout
      uses: actions/checkout@v7
      with:
        # Empty on a tag push, which checks out the triggering tag as usual.
        ref: ${{ inputs.tag }}

    - name: Query Git Tag
      id: git-tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Setup Python
      uses: "actions/setup-python@v7"
      with:
        # setup-python v2 defaulted to 3.x; v7 dropped the default and falls back
        # to the system interpreter, which is externally managed on Ubuntu.
        python-version: "3.x"

    - name: Create package
      run: python release/package.py

    - name: Create GitHub draft release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.git-tag.outputs.tag }}
        artifacts: "misuka-blender.zip"
        artifactErrorsFailBuild: true
        bodyFile: "release/release_body_template.md"
        draft: true
        name: "misuka Blender ${{ steps.git-tag.outputs.tag }}"
